<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League Client Full MVP</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="left">
        <div class="logo">L</div>
        <div class="party-pill">PARTY</div>
        <nav class="game-nav">
          <button class="game-tab active" type="button">LEAGUE</button>
          <button class="game-tab" type="button">TFT</button>
          <button class="game-tab" type="button">LoR</button>
        </nav>
      </div>
      <div class="right">
        <div class="currency">0 RP</div>
        <div class="currency">7921 BE</div>
        <div class="profile">
          <div class="level">143</div>
          <div>
            <div class="name">EveryTachyon</div>
            <div class="state">In Queue</div>
          </div>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="nav-rail">
        <button class="rail-btn active" data-view="play">Play</button>
        <button class="rail-btn" data-view="overview">MVP</button>
        <button class="rail-btn" data-view="database">Andmebaas</button>
        <button class="rail-btn" data-view="relations">Seosed</button>
        <button class="rail-btn" data-view="summoners">Summoners</button>
        <button class="rail-btn" data-view="champions">Champions</button>
        <button class="rail-btn" data-view="matches">Match History</button>
        <button class="rail-btn" data-view="runes">Rune Pages</button>
        <button class="rail-btn" data-view="ranks">Ranks</button>
      </aside>

      <main class="main" id="main-content"></main>

      <aside class="social" id="social-panel"></aside>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
